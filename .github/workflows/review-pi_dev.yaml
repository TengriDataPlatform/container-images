---
name: AI Pideview
on:
  # checkov:skip=CKV_GHA_7: dispatch only pipeline
  workflow_dispatch:
    inputs:
      llm-api-model:
        description: "custom model"
        type: string
      llm-api-url:
        description: "custom API url"
        type: string
      llm-api-token:
        description: "custom API token"
        type: string
      pr-number:
        description: "pull request number (resolved from branch if empty)"
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  ai-review:
    runs-on: [self-hosted, debian13, build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: false
      - name: Run AI review
        uses: megalomania428/github-actions/review-pi_dev@master
        env:
          HTTP_PROXY: ${{ secrets.PROXY_HTTP }}
          SOCKS_PROXY: ${{ secrets.PROXY_SOCKS }}
          NO_PROXY: ".in.tengri-data.ru,.postgrespro.ru,10.128.21.61,localhost,127.0.0.1"
          LLM_URL: ${{ inputs.llm-api-url || secrets.LLM_API_URL }} # gitleaks:allow
          LLM_NAME: "${{ inputs.llm-api-model ||
            secrets.LLM_API_MDL2PI }}" # gitleaks:allow
          LLM_KEY: "${{ inputs.llm-api-token ||
            !inputs.llm-api-url && secrets.GLM_API_KEY || 'dummy' }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH_MCP_URL: ${{ secrets.SEARCH_MCP_URL }}
          SEARCH_MCP_KEY: ${{ secrets.SEARCH_MCP_KEY }}
          FETCH_MCP_URL: ${{ secrets.FETCH_MCP_URL }}
          FETCH_MCP_KEY: ${{ secrets.FETCH_MCP_KEY }}
          IMAGE: "nexus01.in.tengri-data.ru/cont-ghcr/raven428/review-pi_dev:latest"
        with:
          pr_number: ${{ inputs.pr-number }}
